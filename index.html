<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FTA Steps Leaderboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html { color-scheme: dark; background: #0A0E14; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout: one dark page. Header, two tabs (Departments / Top steppers), content below, owner-only update box at the bottom. Hash-routed. */
:root {
  --bg: #0A0E14;
  --bg-glow: rgba(201, 169, 106, 0.07);
  --surface: #111823;
  --surface-2: #172131;
  --line: #212D3F;
  --fg: #ECE9E2;
  --muted: #8F9AAB;
  --accent: #C9A96A;
  --accent-soft: rgba(201, 169, 106, 0.12);
  --on-accent: #1A1408;
  --danger: #E8928A;
  --silver: #B8C1CE;
  --bronze: #B98C66;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(900px 420px at 50% -80px, var(--bg-glow), transparent 70%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 900px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; text-wrap: balance; margin: 0; letter-spacing: -0.005em; }
.eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 10px; }
h1 { font-size: clamp(32px, 7vw, 48px); line-height: 1.08; }
.lede { color: var(--muted); margin: 12px 0 0; max-width: 56ch; }
.asof { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

.tabs { display: flex; gap: 4px; margin-top: 28px; border-bottom: 1px solid var(--line); }
.tab {
  padding: 12px 18px; margin-bottom: -1px; text-decoration: none;
  color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
a:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

main { margin-top: 24px; }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.dept {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-width: 0; padding: 15px 16px; text-decoration: none;
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px;
}
.dept:hover { border-color: var(--accent); background: var(--surface-2); }
.dept .name { font-weight: 500; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.dept .count { flex: none; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }

.back { display: inline-block; margin-bottom: 18px; color: var(--accent); font-weight: 500; text-decoration: none; padding: 4px 0; }
.back:hover { text-decoration: underline; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.head h2 { font-size: clamp(26px, 5.5vw, 36px); line-height: 1.15; min-width: 0; }
.search { flex: 1 1 220px; max-width: 320px; }
.search input {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
.search input::placeholder { color: var(--muted); }

.tablewrap { margin-top: 18px; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 13px 16px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
tbody tr:last-child td { border-bottom: 0; }
td.pos { width: 1%; white-space: nowrap; font-weight: 600; color: var(--muted); }
td.name { font-weight: 500; overflow-wrap: anywhere; }
td.team, td.dpt { color: var(--muted); font-size: 14px; }
td.dpt a, .sub a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
td.dpt a:hover, .sub a:hover { color: var(--accent); border-bottom-color: var(--accent); }
th.num, td.num { text-align: right; white-space: nowrap; }
td.num { font-weight: 600; }
tr.lead td { background: var(--accent-soft); }
tr.lead td.pos { color: var(--accent); }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; }

.rank { font-family: var(--font-display); font-size: 20px; font-weight: 500; }
.r1 { color: var(--accent); } .r2 { color: var(--silver); } .r3 { color: var(--bronze); }
td.steps { width: 190px; }
.steps .n { display: block; text-align: right; font-weight: 600; }
.bar { display: block; height: 3px; margin-top: 7px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.sub { display: none; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
.note { margin: 14px 2px 0; color: var(--muted); font-size: 13px; }

.ranking-heading { margin-bottom: 18px; }
.ranking-heading h2 { font-size: clamp(28px, 5.5vw, 38px); }
.weekly-notice { color: var(--accent); font-size: 17px; font-weight: 600; margin: 8px 0 4px; }
.week-ending { color: var(--muted); font-size: 13px; margin: 0; }
.ranking-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.ranking-card { min-width: 0; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.ranking-card h3 { color: var(--accent); font-size: 21px; margin: 0 0 10px; }
.ranking-table { margin: 0; border: 0; background: transparent; }
.ranking-table th, .ranking-table td { padding: 12px 10px; }
.ranking-table td:last-child { overflow-wrap: anywhere; }
.ranking-table .rank-cell { width: 54px; color: var(--accent); font-family: var(--font-display); font-size: 20px; }
@media (max-width: 640px) { .ranking-grid { grid-template-columns: 1fr; } }


@media (max-width: 640px) {
  .col-team, .col-dpt { display: none; }
  .sub { display: block; }
  th, td { padding: 11px 12px; }
  td.steps { width: 110px; }
  .tab { padding: 12px 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .dept, .tab, .bar i { transition: border-color .15s, color .15s, background-color .15s; }
}
</style>
</head>
<body>
<div id="root"></div>

<!-- Live data is loaded from leaderboard-data.json. Replace that file to update scores. -->
<script>
var MARKUP = `
<div class="wrap">
  <header>
    <p class="eyebrow">Federal Tax Authority</p>
    <h1>30×30 Steps Challenge</h1>
    <p class="lede" id="lede"></p>
    <p class="asof" id="asof"></p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Leaderboard views">
    <a class="tab" id="tab-dept" role="tab" href="#departments">Departments</a>
    <a class="tab" id="tab-top" role="tab" href="#top-steppers">Top steppers</a>
    <a class="tab" id="tab-ranking" role="tab" href="#department-ranking">Department Ranking</a>
  </nav>

  <main id="view" aria-live="polite"></main>

</div>
`;

document.getElementById('root').innerHTML = MARKUP;

var STATE = null;
var DATA = [];

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }

var depts = {};
var names = [];
var bySlug = {};
var top20 = [];

var view = document.getElementById('view');
var lede = document.getElementById('lede');
var tabDept = document.getElementById('tab-dept');
var tabTop = document.getElementById('tab-top');
var tabRanking = document.getElementById('tab-ranking');

function setTab(which){
  tabDept.setAttribute('aria-selected', which === 'dept' ? 'true' : 'false');
  tabTop.setAttribute('aria-selected', which === 'top' ? 'true' : 'false');
  tabRanking.setAttribute('aria-selected', which === 'ranking' ? 'true' : 'false');
}

function renderPicker(){
  setTab('dept');
  lede.hidden = false;
  lede.textContent = 'Choose your department to see its participants and their total steps.';
  document.title = 'FTA Steps Leaderboard';
  view.innerHTML = '<div class="picker">' + names.map(function(n){
    return '<a class="dept" href="#' + slug(n) + '"><span class="name">' + esc(n) + '</span><span class="count" aria-label="' + depts[n].length + ' participants">' + depts[n].length + '</span></a>';
  }).join('') + '</div>';
}

function rowsHtml(list, q){
  var out = list.filter(function(r){ return !q || r.n.toLowerCase().indexOf(q) !== -1; });
  if(!out.length) return '<tr><td colspan="4" class="empty">No participant matches that name.</td></tr>';
  return out.map(function(r, i){
    return '<tr' + (!q && i === 0 ? ' class="lead"' : '') + '><td class="pos">' + r.p + '</td><td class="name">' + esc(r.n) + '</td><td class="team col-team">' + esc(r.t) + '</td><td class="num">' + fmt(r.s) + '</td></tr>';
  }).join('');
}

function renderDept(name){
  var list = depts[name];
  setTab('dept');
  lede.hidden = true;
  document.title = name + ' | FTA Steps Leaderboard';
  view.innerHTML =
    '<a class="back" href="#departments">&larr; All departments</a>' +
    '<div class="head"><div><p class="eyebrow">' + list.length + ' participants</p><h2>' + esc(name) + '</h2></div>' +
    '<div class="search"><input id="q" type="search" placeholder="Search a name" aria-label="Search a name"></div></div>' +
    '<div class="tablewrap"><table><thead><tr><th>Position</th><th>Name</th><th class="col-team">Team</th><th class="num">Total steps</th></tr></thead><tbody id="rows">' + rowsHtml(list, '') + '</tbody></table></div>';
  document.getElementById('q').addEventListener('input', function(e){
    document.getElementById('rows').innerHTML = rowsHtml(list, e.target.value.trim().toLowerCase());
  });
  window.scrollTo(0, 0);
}

function renderTop(){
  setTab('top');
  lede.hidden = false;
  lede.textContent = 'The twenty highest step counts across every department.';
  document.title = 'Top steppers | FTA Steps Leaderboard';
  var max = (top20[0] && top20[0].s) || 1;
  var rows = top20.map(function(r, i){
    var rc = i < 3 ? ' r' + (i + 1) : '';
    var link = '<a href="#' + slug(r.t) + '">' + esc(r.t) + '</a>';
    return '<tr><td class="pos"><span class="rank' + rc + '">' + (i + 1) + '</span></td>' +
      '<td class="name">' + esc(r.n) + '<span class="sub">' + link + '</span></td>' +
      '<td class="dpt col-dpt">' + link + '</td>' +
      '<td class="steps"><span class="n">' + fmt(r.s) + '</span><span class="bar"><i style="width:' + Math.max(2, Math.round(r.s / max * 100)) + '%"></i></span></td></tr>';
  }).join('');
  view.innerHTML =
    '<div class="tablewrap"><table><thead><tr><th>Rank</th><th>Name</th><th class="col-dpt">Department</th><th class="num">Total steps</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="note">Tap a department to see its full list.</p>';
  window.scrollTo(0, 0);
}


function rankingRows(items){
  var rows = Array.isArray(items) ? items : [];
  return [1,2,3,4].map(function(rank){
    var item = rows.find(function(x){ return Number(x.rank) === rank; });
    var department = item && item.department ? String(item.department).trim() : '';
    return '<tr><td class="rank-cell">' + rank + '</td><td>' +
      (department ? esc(department) : '<span style="color:var(--muted)">To be announced</span>') +
      '</td></tr>';
  }).join('');
}

function renderRanking(data){
  setTab('ranking');
  lede.hidden = true;
  document.title = 'Department Ranking | 30×30 Steps Challenge';
  var weekEnding = data && data.weekEnding ? esc(data.weekEnding) : 'To be announced';
  view.innerHTML =
    '<div class="ranking-heading">' +
      '<p class="eyebrow">30×30 Steps Challenge</p>' +
      '<h2>Department Ranking</h2>' +
      '<p class="weekly-notice">Updated Weekly — Every Friday at 06:00 PM</p>' +
      '<p class="week-ending">Week ending: ' + weekEnding + '</p>' +
    '</div>' +
    '<div class="ranking-grid">' +
      '<section class="ranking-card"><h3>Large Departments Ranking</h3>' +
        '<div class="tablewrap ranking-table"><table><thead><tr><th>Rank</th><th>Department</th></tr></thead>' +
        '<tbody>' + rankingRows(data && data.large) + '</tbody></table></div></section>' +
      '<section class="ranking-card"><h3>Small Departments Ranking</h3>' +
        '<div class="tablewrap ranking-table"><table><thead><tr><th>Rank</th><th>Department</th></tr></thead>' +
        '<tbody>' + rankingRows(data && data.small) + '</tbody></table></div></section>' +
    '</div>';
  window.scrollTo(0, 0);
}

function loadRanking(){
  fetch('./department-ranking.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(response){ if(!response.ok) throw new Error('Ranking file is not available yet'); return response.json(); })
    .then(renderRanking)
    .catch(function(){
      renderRanking({large:[], small:[], weekEnding:'To be announced'});
    });
}

function route(){
  var h = (location.hash || '').replace('#','');
  if(h === 'top-steppers') renderTop();
  else if(h === 'department-ranking') loadRanking();
  else if(h && bySlug[h]) renderDept(bySlug[h]);
  else renderPicker();
}
function startLeaderboard(){
  fetch('./leaderboard-data.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(response){ if(!response.ok) throw new Error('Data file could not be loaded'); return response.json(); })
    .then(function(state){
      STATE = state;
      DATA = Array.isArray(state.rows) ? state.rows : [];
      document.getElementById('asof').textContent = 'Updated ' + (state.asOf || 'date not supplied');
      if(!DATA.length) throw new Error('No participant rows were found in the data file');
      depts = {};
      DATA.forEach(function(r){ (depts[r.t] = depts[r.t] || []).push(r); });
      names = Object.keys(depts).sort(function(a,b){ return a.localeCompare(b); });
      bySlug = {};
      names.forEach(function(n){ bySlug[slug(n)] = n; depts[n].sort(function(a,b){ return a.p - b.p; }); });
      top20 = DATA.slice().sort(function(a,b){ return (b.s - a.s) || (a.p - b.p); }).slice(0, 20);
      window.addEventListener('hashchange', route);
      route();
    })
    .catch(function(err){
      document.getElementById('asof').textContent = 'Unable to load latest scores';
      document.getElementById('view').innerHTML = '<p class=\"empty\">The leaderboard data could not be loaded. Please try refreshing the page. (' + esc(err.message) + ')</p>';
    });
}
startLeaderboard();

</script>
</body>
</html>
